name: iOS 27 (trusted manual runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: [self-hosted, macOS, ARM64, floweroll-ios27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: scripts/verify_ios_regression.sh build
      - run: scripts/verify_ios_regression.sh unit
